name: Admin Security Audit

on:
  push:
    branches: ["main"]
    paths:
      - "ai-admin.html"
      - "assets/admin-console.js"
      - "cloud-admin.html"
      - "cloud-admin.js"
      - ".github/workflows/admin-security-audit.yml"
  pull_request:
    paths:
      - "ai-admin.html"
      - "assets/admin-console.js"
      - "cloud-admin.html"
      - "cloud-admin.js"
      - ".github/workflows/admin-security-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check admin JavaScript syntax
        run: node --check assets/admin-console.js
      - name: Check cloud dashboard JavaScript syntax
        run: node --check cloud-admin.js
      - name: Verify unified cloud module and account creation safety
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import assert from "node:assert/strict";
          const html = readFileSync("ai-admin.html", "utf8");
          const js = readFileSync("assets/admin-console.js", "utf8");
          const policy = html.match(/<meta http-equiv="Content-Security-Policy" content="([^"]+)">/i)?.[1] || "";
          const scriptSrc = policy.split(";").map(part => part.trim()).find(part => part.startsWith("script-src "));
          assert.match(scriptSrc || "", /script-src 'self'/);
          assert.doesNotMatch(scriptSrc || "", /unsafe-inline|unsafe-eval/);
          assert.match(policy, /connect-src 'self' https:\/\/api\.zhixing\.us\.ci/);
          assert.match(html, /data-view="cloud"/, "Cloud data must be part of the unified menu.");
          assert.match(html, /id="cloudPane-accounts"/, "Account management must be in the unified UI.");
          assert.match(html, /id="cloudCreateAccountForm"/, "Admin account registration form must exist.");
          assert.match(html, /id="modelPicker"/, "Model selection must use a native select control.");
          assert.match(html, /id="providerPreset"/, "Provider switcher must be present.");
          assert.match(html, /id="providerPortal"/, "The selected provider's console link must be present.");
          assert.match(html, /id="balanceView"/, "Balance results must be visible in the model configuration panel.");
          assert.match(js, /function providerForUrl\(/, "Saved API URLs must map to a provider.");
          assert.match(js, /providerChanged&&!b\.apiKey/, "Changing providers must require a new provider token.");
          assert.match(js, /async function balanceCheck\(/, "Balance lookup must remain available.");
          assert.match(js, /d\.provider==="DeepSeek"/, "Balance view must handle DeepSeek.");
          assert.match(js, /d\.provider==="OpenRouter"/, "Balance view must handle OpenRouter.");
          assert.match(js, /d\.provider==="SiliconFlow"/, "Balance view must handle SiliconFlow.");
          assert.doesNotMatch(html, /datalist id="modelOptions"/, "Avoid unreliable mobile datalist selection.");
          assert.match(js, /modelPicker.*addEventListener\("change"/, "Model dropdown must synchronize the selected model.");
          assert.match(js, /function renderModelPicker\(/, "Model list must populate the native selector.");
          assert.match(js, /data-cloud-account-delete=/, "Account list must expose the guarded unregister action.");
          assert.match(js, /data-cloud-account-chats=/, "Account list must expose cross-product chat history.");
          assert.match(js, /\/admin\/cloud\/accounts\/delete/, "Account deletion must use the protected Worker endpoint.");
          assert.match(js, /DELETE_ACCOUNT/, "Account deletion must use an explicit confirmation.");
          assert.match(html, /<option value="all">全部产品<\/option>/, "Conversation filter must support both products.");
          assert.match(js, /result\.tokens\.cloud/, "Unified login must receive its scoped cloud token.");
          assert.match(js, /\/admin\/cloud\/accounts/, "Account operations must use the protected Worker endpoint.");
          assert.match(js, /emailOwnershipConfirmed/, "Account creation must require mailbox ownership confirmation.");
          assert.match(js, /body\.textContent=m\.content/, "Stored chat content must be rendered as text, not HTML.");
          assert.match(js, /sessionStorage\.setItem\(TOKEN_KEY\+app,token\)/);
          assert.doesNotMatch(html + "\n" + js, /SUPABASE_SERVICE_ROLE_KEY|sb_secret_|service_role/i);
          assert.doesNotMatch(js, /localStorage\.setItem\([^)]*(?:token|TOKEN_KEY)/i);
          assert.match(readFileSync("cloud-admin.html", "utf8"), /ai-admin\.html\?view=cloud/);
          assert.match(readFileSync("cloud-admin.js", "utf8"), /location\.replace\("\/ai-admin\.html\?view=cloud"\)/);
          assert.match(html, /id="userLoginForm"/, "End users must have a separate login form.");
          assert.match(html, /id="userPortal"/, "End users must land in a self-service-only portal.");
          assert.match(html, /id="userPasswordForm"/, "End users must have a password-management form.");
          assert.match(html, /\[hidden\]\{display:none!important\}/, "Hidden panels must remain hidden despite display rules.");
          assert.match(html, /grid-template-columns:repeat\(3,minmax\(0,1fr\)\)/, "Mobile nav should use a wrapping grid, not a horizontal scroller.");
          assert.match(js, /async function userLogin/, "User login handler must exist.");
          assert.match(js, /\/api\/account\/password/, "Password changes must go through the Worker.");
          assert.match(js, /sessionStorage\.setItem\("zx-ai-user-refresh-token"/, "User refresh tokens should be session-scoped.");
          assert.match(js, /app==="user"&&path==="\/api\/account\/password"/, "Wrong-current-password errors must not be mistaken for expired sessions.");
          assert.match(js, /userProfileIp/, "The self-service page must show only the current account's registration IP.");
          console.log("Unified admin, end-user isolation, login session handling, responsive navigation, and secret isolation passed.");
          NODE
      - name: Verify CSP and secret-handling invariants
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { createHash } from "node:crypto";
          import assert from "node:assert/strict";

          const html = readFileSync("ai-admin.html", "utf8");
          const match = html.match(/<meta http-equiv="Content-Security-Policy" content="([^"]+)">/i);
          assert.ok(match, "The admin page must ship a CSP meta policy.");
          const policy = match[1];
          const scriptSrc = policy.split(";").map(part => part.trim()).find(part => part.startsWith("script-src "));
          assert.ok(scriptSrc, "CSP must define script-src.");
          assert.doesNotMatch(scriptSrc, /unsafe-inline|unsafe-eval/, "Executable inline scripts must be hash-authorized.");
          assert.match(policy, /base-uri 'none'/);
          assert.match(policy, /form-action 'none'/);
          assert.match(policy, /object-src 'none'/);
          assert.match(policy, /frame-src 'none'/);

          const declared = [...scriptSrc.matchAll(/'sha256-([^']+)'/g)].map(item => item[1]).sort();
          const actual = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi)]
            .filter(item => !/\bsrc\s*=/i.test(item[1]))
            .map(item => createHash("sha256").update(item[2]).digest("base64")).sort();
          assert.deepEqual(declared, actual, "Every inline script must match a CSP hash; refresh CSP when scripts change.");
          assert.match(html, /name="referrer" content="no-referrer"/i);
          let adminLogic = "";
          try { adminLogic = readFileSync("assets/admin-console.js", "utf8"); } catch {}
          const securitySource = html + "\n" + adminLogic;
          assert.match(securitySource, /sessionStorage\.setItem\(\s*TOKEN_KEY(?:\s*\+\s*(?:app|app\.id))?\s*,\s*token\s*\)/, "Admin tokens should be session-scoped, including per-product sessions.");
          assert.doesNotMatch(securitySource, /localStorage\.setItem\([^)]*(?:TOKEN_KEY|token)/i, "Admin bearer tokens must not be persisted in localStorage.");
          console.log("Admin CSP, inline script hashes, referrer policy, and session token storage checks passed.");
          NODE
