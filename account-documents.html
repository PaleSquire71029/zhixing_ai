<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>账号协议与隐私声明 · 知行</title><style>
:root{color-scheme:light;--ink:#172033;--muted:#68748a;--line:#e4e9f2;--blue:#376bf5}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f8faff,#f1f5fc);color:var(--ink);font:16px/1.8 system-ui,-apple-system,sans-serif}.shell{width:min(880px,calc(100% - 24px));margin:0 auto;padding:24px 0 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.brand{font-weight:750}.back{color:var(--blue);text-decoration:none;font-size:14px}.hero{padding:24px;border:1px solid #e6ecf6;background:#ffffffd9;border-radius:24px;box-shadow:0 12px 36px #263b6610}.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--blue);font-weight:750}.hero h1{font-size:clamp(26px,5vw,36px);line-height:1.25;margin:8px 0}.hero p{color:var(--muted);margin:8px 0 0}.tabs{display:flex;gap:8px;position:sticky;top:0;padding:14px 0;background:#f5f7fbee;backdrop-filter:blur(14px);z-index:2}.tab{border:1px solid var(--line);border-radius:999px;padding:10px 18px;background:#fff;color:#536079;font:inherit;font-size:14px;cursor:pointer}.tab[aria-selected=true]{background:#eaf0ff;border-color:#cdd9ff;color:#204dcc;font-weight:700}.document{background:#fff;border:1px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,38px);box-shadow:0 8px 30px #263b660a;overflow-wrap:anywhere}.document h1{font-size:25px;line-height:1.4;margin:0 0 10px}.document h2{font-size:19px;margin:28px 0 8px;line-height:1.5}.document h3{font-size:16px;margin:20px 0 6px}.document p{margin:8px 0}.document ul,.document ol{padding-left:1.45em}.document li{padding-left:3px;margin:5px 0}.document hr{border:0;border-top:1px solid var(--line);margin:20px 0}.loading{color:var(--muted);padding:34px 0;text-align:center}.foot{text-align:center;font-size:12px;color:var(--muted);padding:20px 8px}@media(max-width:540px){.shell{padding-top:14px}.hero{padding:19px;border-radius:20px}.document{border-radius:18px}.tab{flex:1;padding:10px 7px}}
</style></head><body><main class="shell"><div class="top"><div class="brand">知行 · 账号与隐私</div><a class="back" href="https://ai.zhixing.us.ci/">返回知行AI ↗</a></div><section class="hero"><div class="eyebrow">ACCOUNT & PRIVACY</div><h1>透明、安全地使用知行</h1><p>账号使用协议与隐私声明分别维护。登录前请阅读两份文件；页面直接读取独立的 Markdown 文档。</p></section><div class="tabs" role="tablist" aria-label="文档类型"><button class="tab" id="tab-terms" type="button" role="tab" aria-selected="true">账号使用协议</button><button class="tab" id="tab-privacy" type="button" role="tab" aria-selected="false">隐私声明</button></div><article class="document" id="document" aria-live="polite"><div class="loading">正在读取文档…</div></article><div class="foot">知行产品文档 · 最近更新：2026 年 10 月 23 日</div></main>
<script>
(function(){var el=document.getElementById("document"),tabs={terms:document.getElementById("tab-terms"),privacy:document.getElementById("tab-privacy")},cache={};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")}
function render(md){var lines=String(md||"").replace(/\r\n?/g,"\n").split("\n"),out=[],para=[],list="";
function ep(){if(para.length){out.push("<p>"+inline(para.join(" "))+"</p>");para=[]}}
function endList(){if(list){out.push("</"+list+">");list=""}}
lines.forEach(function(line){var t=line.trim();if(!t){ep();endList();return}
if(/^---+$/.test(t)){ep();endList();out.push("<hr>");return}
var h=t.match(/^(#{1,3})\s+(.+)$/);if(h){ep();endList();var n=h[1].length;out.push("<h"+n+">"+inline(h[2])+"</h"+n+">");return}
var li=t.match(/^([-*]|\d+\.)\s+(.+)$/);if(li){ep();var type=/^\d+\./.test(li[1])?"ol":"ul";if(list!==type){endList();list=type;out.push("<"+type+">")}out.push("<li>"+inline(li[2])+"</li>");return}
if(t.charAt(0)===">"){ep();endList();out.push("<blockquote>"+inline(t.slice(1).trim())+"</blockquote>");return}
endList();para.push(t)});ep();endList();return out.join("\n")}
async function choose(k){Object.keys(tabs).forEach(function(n){tabs[n].setAttribute("aria-selected",String(k===n))});if(!cache[k]){el.innerHTML='<div class="loading">正在读取文档…</div>';try{var r=await fetch("/docs/"+(k==="terms"?"account-agreement.md":"privacy-notice.md"),{cache:"no-cache",credentials:"same-origin"});if(!r.ok)throw Error("HTTP "+r.status);cache[k]=await r.text()}catch(e){el.innerHTML='<div class="loading">文档加载失败，请刷新页面重试。</div>';return}}el.innerHTML=render(cache[k])}
tabs.terms.addEventListener("click",function(){history.replaceState(null,"",location.pathname+"#agreement");choose("terms")});tabs.privacy.addEventListener("click",function(){history.replaceState(null,"",location.pathname+"#privacy");choose("privacy")});choose(location.hash==="#privacy"?"privacy":"terms")})();
</script></body></html>
